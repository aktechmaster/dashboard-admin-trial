<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JurnalPro - Sistem Sekolah Lengkap</title>
    
    <!-- Memanggil CSS Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Memanggil Ikon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- MEMANGGIL LIBRARY SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { min-height: 100vh; background-color: #f4f6f9; overflow-x: hidden; }
        
        /* CSS UNTUK LOGIN */
        #login-section { height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #e9ecef; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white; }
        .login-logo { text-align: center; font-size: 2rem; color: #343a40; margin-bottom: 20px; font-weight: bold; }
        
        /* CSS UNTUK DASHBOARD */
        #dashboard-section { display: none; }
        #sidebar { min-height: 100vh; background-color: #343a40; transition: all 0.3s; width: 280px; }
        #sidebar .nav-link { color: #c2c7d0; padding: 10px 20px; border-radius: 5px; margin-bottom: 2px; }
        #sidebar .nav-link:hover, #sidebar .nav-link.active { background-color: #007bff; color: white; }
        #sidebar .nav-link i.icon-menu { width: 25px; text-align: center; margin-right: 10px; }
        #sidebar .nav-link i.fa-caret-down { width: auto; margin-right: 0; transition: transform 0.3s; }
        #sidebar .submenu { list-style: none; padding-left: 45px; margin-top: 5px; margin-bottom: 10px; }
        #sidebar .submenu a { color: #a8b3c4; text-decoration: none; display: block; padding: 8px 0; font-size: 0.9rem; }
        #sidebar .submenu a:hover { color: white; }
        .logo-area { padding: 20px; color: white; font-size: 1.2rem; font-weight: bold; text-align: center; border-bottom: 1px solid #4f5962; margin-bottom: 20px; }
        #page-content-wrapper { width: 100%; padding: 20px; }
    </style>
</head>
<body>

    <!-- ZONA LOGIN -->
    <div id="login-section">
        <div class="login-card">
            <div class="login-logo">
                <i class="fa-solid fa-graduation-cap text-primary"></i> JurnalPro
            </div>
            <h5 class="text-center mb-4 text-muted">Masuk ke Panel Admin</h5>
            
            <form id="loginForm" onsubmit="prosesLogin(event)">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control" id="emailInput" placeholder="admin@sekolah.com" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Kata Sandi</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="passwordInput" placeholder="Masukkan password" required>
                    </div>
                </div>
                <button type="submit" id="btnMasuk" class="btn btn-primary w-100"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button>
            </form>
        </div>
    </div>

    <!-- ZONA DASHBOARD -->
    <div id="dashboard-section" class="d-flex">
        
        <!-- SIDEBAR -->
        <div id="sidebar" class="d-flex flex-column flex-shrink-0">
            <div class="logo-area">
                <i class="fa-solid fa-graduation-cap"></i> JurnalPro Admin
            </div>
            
            <div class="overflow-auto px-3 mb-auto" style="max-height: calc(100vh - 100px);">
                <ul class="nav nav-pills flex-column">
                    <li class="nav-item">
                        <a href="#" class="nav-link active d-flex align-items-center">
                            <i class="fa-solid fa-gauge-high icon-menu"></i> <span class="me-auto">Dashboard Utama</span>
                        </a>
                    </li>
                    <hr style="border-color: #4f5962; margin: 10px 0;">
                    
                    <li class="nav-item">
                        <a href="#menuUser" data-bs-toggle="collapse" class="nav-link d-flex align-items-center">
                            <i class="fa-solid fa-users-gear icon-menu"></i> <span class="me-auto">Manajemen Pengguna</span> <i class="fa-solid fa-caret-down"></i>
                        </a>
                        <ul class="collapse submenu" id="menuUser">
                            <li><a href="#">Data Admin</a></li>
                            <li><a href="#">Akun Guru & Staf</a></li>
                        </ul>
                    </li>
                    
                    <li class="nav-item">
                        <a href="#menuSiswa" data-bs-toggle="collapse" class="nav-link d-flex align-items-center">
                            <i class="fa-solid fa-user-graduate icon-menu"></i> <span class="me-auto">Database Siswa</span>
                        </a>
                    </li>

                    <hr style="border-color: #4f5962; margin: 10px 0;">

                    <!-- TOMBOL LOGOUT -->
                    <li class="nav-item mt-4 mb-4">
                        <a href="#" onclick="prosesLogout()" class="nav-link text-danger d-flex align-items-center">
                            <i class="fa-solid fa-right-from-bracket icon-menu"></i> <span class="me-auto">Keluar (Logout)</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- KONTEN -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-white rounded shadow-sm mb-4 p-3">
                <div class="container-fluid">
                    <h4 class="mb-0 text-dark">Dashboard Utama</h4>
                    <div class="d-flex align-items-center">
                        <span class="me-3 text-secondary"><i class="fa-solid fa-circle-user fa-lg"></i> <span id="namaAdmin">Admin</span></span>
                    </div>
                </div>
            </nav>

            <div class="container-fluid bg-white p-4 rounded shadow-sm">
                <h5>Selamat Datang di Panel Admin</h5>
                <p class="text-muted">Aplikasi ini sudah dilindungi dengan enkripsi Supabase Auth.</p>
            </div>
        </div>
    </div>

    <!-- Script Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- KONFIGURASI SUPABASE (Solusi Final) -->
    <script>
        // 1. URL Dasar dan Publishable Key
        const supabaseUrl = 'https://vbqihpwsneymfrjzlkrw.supabase.co';
        const supabaseKey = 'sb_publishable_lIrrMLTWNuQ_g0t0BXogpQ_6x5Vt3lh';
        
        // 2. Ganti nama variabel menjadi supabaseClient agar tidak tabrakan!
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // 3. Cek apakah Admin sudah login sebelumnya (Cek Sesi)
        async function cekSesi() {
            const { data, error } = await supabaseClient.auth.getSession();
            if (data.session) {
                tampilkanDashboard(data.session.user.email);
            }
        }
        cekSesi(); 

        // 4. Proses Tombol Masuk Diklik
        async function prosesLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById("emailInput").value;
            const password = document.getElementById("passwordInput").value;
            const btnMasuk = document.getElementById("btnMasuk");

            // Ubah teks tombol jadi Loading
            btnMasuk.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa...';
            btnMasuk.disabled = true;

            // Kirim data ke Supabase (gunakan supabaseClient)
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            // Kembalikan tombol seperti semula
            btnMasuk.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk';
            btnMasuk.disabled = false;

            if (error) {
                alert("Gagal Masuk: Email atau Kata Sandi salah.");
                console.error("Error Login:", error.message);
            } else {
                // Jika sukses, kosongkan form dan buka dashboard
                document.getElementById("loginForm").reset();
                tampilkanDashboard(data.user.email);
            }
        }

        // 5. Fungsi Logika Tampil Dashboard
        function tampilkanDashboard(emailAdmin) {
            document.getElementById("login-section").style.display = "none";
            document.getElementById("dashboard-section").style.setProperty("display", "flex", "important");
            document.getElementById("namaAdmin").innerText = emailAdmin;
        }

        // 6. Proses Tombol Keluar (Logout)
        async function prosesLogout() {
            // Gunakan supabaseClient
            const { error } = await supabaseClient.auth.signOut();
            
            if (!error) {
                document.getElementById("dashboard-section").style.setProperty("display", "none", "important");
                document.getElementById("login-section").style.display = "flex";
            }
        }
    </script>
</body>
</html>
